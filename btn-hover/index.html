<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button-effect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section class="container">
      <a href="../index.html" class="goBack">Go Back</a>
      <div class="demo">
        <div class="btn-box">
          <button class="fx-glitch" data-text="GLITCH">GLITCH</button>
        </div>
      </div>

      <div class="demo">
        <div class="btn-box">
          <button class="fx-neon-pulse">NEON PULSE</button>
        </div>
      </div>

      <div class="demo">
        <div class="btn-box"><button class="fx-push">3D PUSH</button></div>
      </div>

      <div class="demo">
        <div class="btn-box">
          <button class="fx-activate">ACTIVATE CARD</button>
        </div>
      </div>

      <div class="demo">
        <div class="btn-box">
          <button class="fx-rings">RIPPLE RINGS</button>
        </div>
      </div>

      <div class="demo">
        <div class="btn-box">
          <button class="fx-liquid">LIQUID FILL</button>
        </div>
      </div>
    </section>
  </body>
</html>
